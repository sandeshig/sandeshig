name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
